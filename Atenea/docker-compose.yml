services:
  mariadb:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle_user
      MARIADB_PASSWORD: moodle_password

  moodle:
    build: .
    ports:
      - "8083:80"
    depends_on:
      - mariadb
