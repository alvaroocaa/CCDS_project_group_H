# nginx routes for the app stack. Part A: include this inside the server { } block.
#
# Why the resolver + variables: nginx resolves plain hostnames once at startup and
# refuses to start if app_core does not exist yet. With Docker's internal DNS
# (127.0.0.11) and a variable, nginx looks the name up per request instead, so the
# basic stack can start before the app stack. Swarm load-balances across replicas.

resolver 127.0.0.11 valid=10s ipv6=off;

# Metrics are for Grafana on the internal network only, never public
location = /app/metrics {
    return 404;
}

location /app/ {
    set $core_upstream http://app_core:8000;
    rewrite ^/app/(.*)$ /$1 break;          # /app/leaderboard -> /leaderboard
    proxy_pass $core_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /static/ {
    set $static_upstream http://app_static:80;
    rewrite ^/static/(.*)$ /$1 break;       # /static/style.css -> /style.css
    proxy_pass $static_upstream;
    proxy_set_header Host $host;
}
