services:
  mariadb:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: rootpass          # local only
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle_user
      MARIADB_PASSWORD: moodle_password        # local only
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend                                # not reachable from nginx

  moodle:
    build: .
    image: ccds/moodle:1
    environment:
      MOODLE_WWWROOT: http://moodle.localhost
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle_user
      MOODLE_DB_PASSWORD: moodle_password      # local only
      MOODLE_ADMIN_PASSWORD: Atenea-Admin1     # local only
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
      - proxy

networks:
  backend:
  proxy:
    external: true

volumes:
  db_data:
  moodledata: