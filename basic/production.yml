services:
  nginx:
    image: 127.0.0.1:5050/ccds/nginx:1
    environment:
      - DOMAIN=ccds-group-h.duckdns.org
    ports:
      - "80:80"
    networks:
      - proxy
    deploy:
      replicas: 2

  registry:
    image: registry:2
    ports:
      - "5050:5000"
    volumes:
      - registry_data:/var/lib/registry
    deploy:
      replicas: 1

networks:
  proxy:
    external: true

volumes:
  registry_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=172.16.0.4,rw,nfsvers=4
      device: ":/srv/nfs/basic/registry"